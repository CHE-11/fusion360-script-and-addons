<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Better Parameters</title>
  <link id="palette-styles" rel="stylesheet" href="palette.css">
</head>
<body>
  <div id="palette-app">
    <div id="sheet-toolbar">
      <div id="tab-bar" role="tablist">
        <button id="tab-selected" type="button" role="tab">Selected Object</button>
        <button id="tab-all" type="button" role="tab">All Objects</button>
      </div>
      <span id="design-name"></span>
      <input id="search-input" type="search" placeholder="Filter" autocomplete="off" spellcheck="false">
      <button id="refresh-button" type="button">Refresh</button>
    </div>
    <p id="name-rules">A parameter name starts with a letter, then uses only letters, numbers, and underscores. For example, plateWidth or hole_2.</p>
    <div id="sheet-scroll" tabindex="0">
      <table id="parameter-table">
        <colgroup id="parameter-columns">
          <col id="col-gutter">
          <col id="col-name">
          <col id="col-expression">
          <col id="col-value">
          <col id="col-unit">
          <col id="col-comment">
          <col id="col-object">
        </colgroup>
        <thead id="parameter-head">
          <tr id="parameter-header-row">
            <th id="header-gutter"></th>
            <th id="header-name">Name</th>
            <th id="header-expression">Expression</th>
            <th id="header-value">Value</th>
            <th id="header-unit">Unit</th>
            <th id="header-comment">Comment</th>
            <th id="header-object">Object</th>
          </tr>
        </thead>
        <tbody id="parameter-body"></tbody>
      </table>
    </div>
    <div id="status-message">Click a name to copy it. Double-click a cell to edit. Type in the last row to add a user parameter.</div>
    <div id="copy-toast" role="status"></div>
  </div>
  <script id="palette-script" src="palette.js"></script>
</body>
</html>
